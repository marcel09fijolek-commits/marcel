@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');

h1,h2,.kx-hero h1,.kx-zp-hero h1,.kx-og-hero h1,.kx-ms-hero h1{font-family:'Playfair Display',Georgia,'Times New Roman',serif!important;font-weight:700!important;letter-spacing:.2px!important}

.nv-post-cover{position:relative!important}
.nv-post-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(18,35,58,.58),rgba(30,58,95,.32));pointer-events:none}

.kx-reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}

.header-menu-sidebar-inner{padding:4px 0!important}
.header-menu-sidebar .navbar-toggle-wrapper{padding:6px 10px!important}
.header-menu-sidebar-bg{justify-content:flex-start!important}
.header-menu-sidebar .nav-ul>li:first-child>.wrap>a{padding-top:4px!important}
.kx-reveal.kx-in{opacity:1!important;transform:translateY(0)!important}
</style>
<script>
(function(){
  function boot(){
    if(!('IntersectionObserver' in window)){
      document.querySelectorAll('.kx-reveal').forEach(function(el){ el.classList.add('kx-in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('kx-in'); io.unobserve(e.target); }
      });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.kx-reveal:not(.kx-in)').forEach(function(el){ io.observe(el); });
    window.__kxIO = io;
  }
  window.kxObserveReveal = function(){
    if(window.__kxIO){
      document.querySelectorAll('.kx-reveal:not(.kx-in)').forEach(function(el){ window.__kxIO.observe(el); });
    }
  };
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
</script>
