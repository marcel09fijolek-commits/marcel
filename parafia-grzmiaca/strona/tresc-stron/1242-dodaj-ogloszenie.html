<script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>

<div class="kx-og">
  <div class="kx-og-top">
    <a href="/zarzadzanie/">&larr; Wróć do wyboru</a>
  </div>

  <div class="kx-og-hero">
    <h1>Dodaj ogłoszenie</h1>
    <p>Panel ogłoszeń parafialnych</p>
  </div>

  <div class="kx-og-card">
    <h2>Nowe ogłoszenie</h2>
    <div class="kx-og-tools">
      <button type="button" class="kx-og-tpl-btn" id="kx-og-tpl-btn">&#128221; Wstaw szablon niedzielny</button>
    </div>
    <form id="kx-og-form">
      <div class="kx-og-field">
        <label>Tytuł ogłoszenia</label>
        <input type="text" name="tytul" id="kx-og-tytul" placeholder="np. 23. Niedziela zwykła" required>
      </div>
      <div class="kx-og-field">
        <label>Treść ogłoszenia</label>
        <textarea name="tresc" id="kx-og-tresc"></textarea>
      </div>
      <div class="kx-og-field">
        <label>Zdjęcie (opcjonalnie)</label>
        <div class="kx-og-upload">
          <input type="file" name="zdjecie" id="kx-og-zdjecie" accept="image/*">
          <img class="kx-og-preview" id="kx-og-preview">
        </div>
      </div>
      <button type="submit" class="kx-og-submit" id="kx-og-submit">Opublikuj ogłoszenie</button>
      <div class="kx-og-msg" id="kx-og-msg"></div>
    </form>
  </div>

  <div class="kx-og-card kx-og-list">
    <h2>Opublikowane ogłoszenia</h2>
    <div id="kx-og-listwrap"><p class="kx-og-empty">Wczytywanie&#8230;</p></div>
  </div>
</div>

<script>
(function(){
  var TPL = "OGŁOSZENIA DUSZPASTERSKIE\n\n" +
    "1. W tym tygodniu:\n- \n\n" +
    "2. \n\n" +
    "3. \n\n" +
    "Wszystkim Solenizantom i Jubilatom, Parafianom i Gościom składam życzenia Bożego błogosławieństwa.\n\n" +
    "ks. Mariusz Kuropatnicki, proboszcz";

  var editor = null;
  tinymce.init({
    selector: '#kx-og-tresc',
    plugins: 'lists link paste',
    toolbar: 'undo redo | bold italic underline | bullist numlist | removeformat | link',
    menubar: false,
    language: 'pl',
    height: 300,
    branding: false,
    promotion: false,
    entity_encoding: 'raw',
    paste_as_text: false,
    paste_data_images: false,
    valid_elements: 'p,br,strong/b,em/i,u,ul,ol,li,a[href|target],span[style],div',
    valid_styles: { '*': 'color,font-size,text-align' },
    setup: function(ed){
      editor = ed;
      ed.on('PastePostProcess', function(e){
        e.node.innerHTML = e.node.innerHTML.replace(/style="[^"]*"/g, '');
      });
    }
  });

  document.getElementById('kx-og-tpl-btn').addEventListener('click', function(){
    if(editor){ editor.setContent(TPL.split('\n').map(function(l){return l ? '<p>'+l+'</p>' : '<p>&nbsp;</p>';}).join('')); }
  });

  document.getElementById('kx-og-zdjecie').addEventListener('change', function(e){
    var f = e.target.files[0];
    var prev = document.getElementById('kx-og-preview');
    if(f){
      prev.src = URL.createObjectURL(f);
      prev.style.display = 'block';
    } else {
      prev.style.display = 'none';
    }
  });

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function extractDelId(href){
    var m = href.match(/del=([0-9]+)/);
    return m ? m[1] : '';
  }

  function loadList(){
    var wrap = document.getElementById('kx-og-listwrap');
    fetch('/ogloszenia/', { credentials: 'include' }).then(function(r){ return r.text(); }).then(function(html){
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var karty = doc.querySelectorAll('.ogloszenie-karta');
      if(!karty.length){
        wrap.innerHTML = '<p class="kx-og-empty">Brak opublikowanych ogłoszeń lub sesja wygasła &mdash; <a href="/zarzadzanie/">zaloguj się ponownie</a>.</p>';
        return;
      }
      var out = '';
      karty.forEach(function(k){
        var img = k.querySelector('.ogloszenie-img');
        var h4 = k.querySelector('h4');
        var tekst = k.querySelector('.tekst-podglad');
        var small = k.querySelector('small');
        var del = k.querySelector('a[href*="del="]');
        var delId = del ? extractDelId(del.getAttribute('href')) : '';
        var imgHtml = '<div class="kx-og-noimg">Brak zdjęcia</div>';
        if(img && img.tagName === 'IMG' && img.src){
          imgHtml = '<img decoding="async" class="kx-og-img" src="' + img.src + '">';
        }
        out += '<div class="kx-og-karta">' + imgHtml +
          '<div class="kx-og-body"><h4>' + (h4 ? h4.innerHTML : '') + '</h4>' +
          '<div class="kx-og-txt">' + (tekst ? tekst.innerHTML : '') + '</div>' +
          (small ? '<small>' + small.innerHTML + '</small>' : '') +
          '</div>' +
          (delId ? '<button type="button" class="kx-og-del" data-del-id="' + delId + '">Usuń</button>' : '') +
          '</div>';
      });
      wrap.innerHTML = out;
      wrap.querySelectorAll('.kx-og-del').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-del-id');
          var ok = window.confirm('Na pewno usunąć?');
          if (!ok) { return; }
          btn.disabled = true;
          btn.textContent = '...';
          fetch('/ogloszenia/?del=' + id, { credentials: 'include' }).then(function(){
            loadList();
          }).catch(function(){
            btn.disabled = false;
            btn.textContent = 'Usuń';
            alert('Nie udało się usunąć. Spróbuj ponownie.');
          });
        });
      });
    }).catch(function(){
      wrap.innerHTML = '<p class="kx-og-empty">Nie udało się wczytać listy. Odśwież stronę.</p>';
    });
  }

  document.getElementById('kx-og-form').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('kx-og-submit');
    var msg = document.getElementById('kx-og-msg');
    var tytul = document.getElementById('kx-og-tytul').value;
    var tresc = editor ? editor.getContent() : '';
    var plik = document.getElementById('kx-og-zdjecie').files[0];

    if(!tytul){ return; }

    btn.disabled = true;
    btn.textContent = 'Publikowanie...';
    msg.style.display = 'none';

    var fd = new FormData();
    fd.append('tytul', tytul);
    fd.append('tresc', tresc);
    if(plik){ fd.append('zdjecie', plik); }
    fd.append('dodaj', '1');

    fetch('/ogloszenia/', { method: 'POST', credentials: 'include', body: fd }).then(function(r){ return r.text(); }).then(function(html){
      if(html.indexOf('Wyloguj') === -1){
        msg.className = 'kx-og-msg err';
        msg.textContent = 'Sesja wygasła. Zaloguj się ponownie przez /zarzadzanie/.';
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Opublikuj ogłoszenie';
        return;
      }
      msg.className = 'kx-og-msg ok';
      msg.textContent = 'Ogłoszenie opublikowane.';
      msg.style.display = 'block';
      document.getElementById('kx-og-tytul').value = '';
      if(editor){ editor.setContent(''); }
      document.getElementById('kx-og-zdjecie').value = '';
      document.getElementById('kx-og-preview').style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Opublikuj ogłoszenie';
      loadList();
    }).catch(function(){
      msg.className = 'kx-og-msg err';
      msg.textContent = 'Błąd połączenia. Spróbuj ponownie.';
      msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Opublikuj ogłoszenie';
    });
  });

  loadList();
})();
</script>
